[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bangla-doc-kie"
version = "0.1.0"
description = "Span-grounded JSON extraction for Bangla transactional documents with a verifier-driven flywheel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.20.0",
    "transformers>=4.40.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
